<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/login_styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<div class="fillheight" >
  <div class="container flex_col background">



    <div class="box ">
      <form>
        <fieldset class="container flex_col">

          <label>REGISTER</label>

          <label for="email">E-Mail</label>
          <input type="email" id="email">

          <label for="username">Username</label>
          <input type="text" id="username">

          <label for="password">Passwort</label>
          <input type="password" id="password">

          <label for="passwordrepeat">Passwort Wiederholen</label>
          <input type="password" id="passwordrepeat">

          <button type="submit" class="login" id="login">REGISTRIEREN</button>

          <!-- rel="noopener noreferrer" for security reasons  -->
          <a href="login_page.html" target="_blank" rel="noopener noreferrer">got account?</a>

        </fieldset>
      </form>
    </div>


  </div>
</div>


</body>
</html>
