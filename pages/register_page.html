<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../styles/homepage.css">
  <link rel="stylesheet" href="../styles/login_styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Registrieren</title>
  <link rel="icon" type="image/x-icon" href="../imgs/meta/favicon.png">
</head>
<body>

<header>
  <div class="container flex_row fillheight">

    <div class="hoverable"><a href="homepage.html" target="_blank" rel="noopener noreferrer"><img alt="logo" src="../imgs/meta/logo.png" id="logo"></a></div>

    <div class="hoverable">Entdecken</div>
    <label>
      <input type="text" placeholder="Search...">
    </label>

    <a class="hoverable" href="top_movies.html" target="_blank" rel="noopener noreferrer">Top-Filme</a>
    <div>Watchlist</div>
    <a class="login hoverable" href="login_page.html" target="_blank" rel="noopener noreferrer">LOGIN</a>
  </div>
</header>

<div class="fillheight" >
  <div class="container flex_col background">



    <div class="box ">
      <form>
        <fieldset class="container flex_col">

          <label>Registrieren</label>

          <label for="email">E-Mail</label>
          <input type="email" id="email">

          <label for="username">Benutzername</label>
          <input type="text" id="username">

          <label for="password">Passwort</label>
          <input type="password" id="password">

          <label for="passwordrepeat">Passwort Wiederholen</label>
          <input type="password" id="passwordrepeat">

          <button type="submit" class="login" id="login">REGISTRIEREN</button>

          <!-- rel="noopener noreferrer" for security reasons  -->
          <a href="login_page.html" target="_blank" rel="noopener noreferrer">Hast bereits ein Account?</a>

        </fieldset>
      </form>
    </div>


  </div>
</div>


</body>
</html>
